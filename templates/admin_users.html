{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Utilisateurs enregistrés</h2>

    <div class="table-responsive">
        <table class="table table-striped">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Email</th>
                </tr>
            </thead>

            <tbody>

                {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.full_name }}</td>
                    <td>{{ user.email }}</td>
                </tr>
                {% endfor %}

            </tbody>

        </table>
    </div>

</div>

{% endblock %}
