<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - World Cup 2026</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>
    .login-page-wrapper {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-layout-row {
        width: 100%;
        align-items: center;
        justify-content: center;
    }

    .login-side-mascot {
        max-width: 390px;
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 14px 24px rgba(0,0,0,0.35));
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .login-side-mascot:hover {
        transform: scale(1.07);
        filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.85));
    }

    .login-mascot-left {
        transform: translateX(-70px);
    }

    .login-mascot-right {
        transform: translateX(70px);
    }

    .login-mascot-right a {
        display: inline-block;
        text-decoration: none;
    }

    .login-card {
        border-radius: 22px !important;
        overflow: hidden;
        position: relative;
        z-index: 2;
    }

    @media (max-width: 1200px) {
        .login-side-mascot {
            max-width: 310px;
        }

        .login-mascot-left {
            transform: translateX(-35px);
        }

        .login-mascot-right {
            transform: translateX(35px);
        }
    }

    @media (max-width: 991px) {
        .login-page-wrapper {
            min-height: auto;
            padding-top: 25px;
            padding-bottom: 25px;
        }

        .login-mascot-left,
        .login-mascot-right {
            transform: none;
        }

        .login-side-mascot {
            max-width: 210px;
            margin-bottom: 15px;
        }
    }

    @media (max-width: 576px) {
        .login-side-mascot {
            max-width: 160px;
        }
    }
</style>

</head>

<body>

<div class="world-bg"></div>

{% include 'navbar.html' %}

<div class="container-fluid my-5 login-page-wrapper">

<div class="row login-layout-row">

    <div class="col-lg-3 col-md-12 text-center login-mascot-left">
        <img src="{{ url_for('static', filename='images/foziM3.png') }}"
             alt="Mascotte FoziFoot gauche"
             class="login-side-mascot">
    </div>

    <div class="col-lg-5 col-md-8 col-sm-11">

        <div class="card shadow-lg border-0 login-card">

            <div class="card-header bg-dark text-white text-center">

                <img src="{{ url_for('static', filename='images/ball.png') }}"
                     width="60"
                     class="mb-2"
                     alt="World Cup 2026">

                <h3 class="mb-0">
                    Connexion
                </h3>

            </div>

            <div class="card-body p-4">

                {% if error %}
                <div class="alert alert-danger text-center">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            Email visiteur ou nom admin
                        </label>

                        <input type="text"
                               name="email_or_username"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Mot de passe
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Se connecter
                    </button>

                </form>

                <div class="text-center mt-3">
                    <a href="/forgot-password"
                       class="text-decoration-none fw-bold">
                        Mot de passe oublié ?
                    </a>
                </div>

                <hr>

                <div class="text-center">

                    <p class="mb-2">
                        Nouveau visiteur ?
                    </p>

                    <a href="/register"
                       class="btn btn-success">
                        Créer un compte
                    </a>

                </div>

            </div>

        </div>

    </div>

    <div class="col-lg-3 col-md-12 text-center login-mascot-right">
        <a href="/sponsor" title="Devenir sponsor FoziFoot">
            <img src="{{ url_for('static', filename='images/foziM4.png') }}"
                 alt="Devenir sponsor FoziFoot"
                 class="login-side-mascot">
        </a>
    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
