<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchs - World Cup 2026</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .navbar-brand-area {
            min-width: 220px;
        }

        .navbar-center {
            flex: 1;
            justify-content: center;
        }

        .admin-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            margin-right: 5px;
        }

        @media (max-width: 991px) {
            .navbar-center {
                justify-content: flex-start;
            }

            .navbar-brand-area {
                min-width: auto;
            }
        }
    </style>
</head>

<body>

<div class="world-bg"></div>

{% include 'navbar.html' %}

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-dark text-white text-center">
                    <h3 class="mb-0">
                        🔐 Connexion
                    </h3>
                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Nom d'utilisateur
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Mot de passe
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary btn-lg">

                                Se connecter

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
