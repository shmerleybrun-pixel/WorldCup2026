<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - World Cup 2026</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>
    .register-page-wrapper {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .register-layout-row {
        width: 100%;
        align-items: center;
        justify-content: center;
    }

    .register-side-mascot {
        width: 460px !important;
        max-width: 460px !important;
        height: auto !important;
        object-fit: contain;
        filter: drop-shadow(0 14px 24px rgba(0,0,0,0.35));
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .register-side-mascot:hover {
        transform: scale(1.08);
        filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.85));
    }

    .register-mascot-left {
        transform: translateX(-140px);
        z-index: 1;
    }

    .register-mascot-right {
        transform: translateX(140px);
        z-index: 1;
    }

    .register-mascot-right a {
        display: inline-block;
        text-decoration: none;
    }

    .register-card {
        border-radius: 22px !important;
        overflow: hidden;
        position: relative;
        z-index: 3;
    }

    @media (max-width: 1400px) {
        .register-side-mascot {
            width: 390px !important;
            max-width: 390px !important;
        }

        .register-mascot-left {
            transform: translateX(-90px);
        }

        .register-mascot-right {
            transform: translateX(90px);
        }
    }

    @media (max-width: 1200px) {
        .register-side-mascot {
            width: 320px !important;
            max-width: 320px !important;
        }

        .register-mascot-left {
            transform: translateX(-45px);
        }

        .register-mascot-right {
            transform: translateX(45px);
        }
    }

    @media (max-width: 991px) {
        .register-page-wrapper {
            min-height: auto;
            padding-top: 25px;
            padding-bottom: 25px;
            overflow: visible;
        }

        .register-mascot-left,
        .register-mascot-right {
            transform: none;
            margin-bottom: 15px;
        }

        .register-side-mascot {
            width: 230px !important;
            max-width: 230px !important;
        }
    }

    @media (max-width: 576px) {
        .register-side-mascot {
            width: 170px !important;
            max-width: 170px !important;
        }
    }
</style>

</head>

<body>

<div class="world-bg"></div>

{% include 'navbar.html' %}

<div class="container-fluid my-5 register-page-wrapper">

<div class="row register-layout-row">

    <div class="col-lg-3 col-md-12 text-center register-mascot-left">
        <img src="{{ url_for('static', filename='images/foziM3.png') }}"
             alt="Mascotte FoziFoot gauche"
             class="register-side-mascot">
    </div>

    <div class="col-lg-5 col-md-8 col-sm-11">

        <div class="card shadow-lg border-0 register-card">

            <div class="card-header bg-primary text-white text-center">

                <img src="{{ url_for('static', filename='images/ball.png') }}"
                     width="60"
                     class="mb-2"
                     alt="World Cup 2026">

                <h3 class="mb-0">
                    Inscription visiteur
                </h3>

            </div>

            <div class="card-body p-4">

                {% if error %}
                <div class="alert alert-danger text-center">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            Nom complet
                        </label>

                        <input type="text"
                               name="full_name"
                               class="form-control"
                               placeholder="Votre nom complet"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Adresse email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="exemple@email.com"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Mot de passe
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Minimum 6 caractères"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Créer mon compte
                    </button>

                </form>

                <hr>

                <div class="text-center">

                    <p class="mb-2">
                        Vous avez déjà un compte ?
                    </p>

                    <a href="/login"
                       class="btn btn-success">
                        Se connecter
                    </a>

                </div>

            </div>

        </div>

    </div>

    <div class="col-lg-3 col-md-12 text-center register-mascot-right">
        <a href="/sponsor" title="Devenir sponsor FoziFoot">
            <img src="{{ url_for('static', filename='images/foziM4.png') }}"
                 alt="Devenir sponsor FoziFoot"
                 class="register-side-mascot">
        </a>
    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
