<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un passeur - World Cup 2026</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="world-bg"></div>

{% include 'navbar.html' %}

<div class="container mt-5 mb-5">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-dark text-white">

            <h2 class="mb-0 d-flex align-items-center">

                <img src="{{ url_for('static', filename='images/player.png') }}"
                     alt="Modifier passeur"
                     style="width:60px; height:auto; margin-right:12px; background:none; border:none;">

                Modifier un passeur

            </h2>

        </div>

        <div class="card-body p-4">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Joueur
                        </label>

                        <input
                            type="text"
                            name="player_name"
                            class="form-control"
                            value="{{ joueur.player_name }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Équipe
                        </label>

                        <input
                            type="text"
                            name="team"
                            class="form-control"
                            value="{{ joueur.team }}"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">
                            Passes décisives
                        </label>

                        <input
                            type="number"
                            name="assists"
                            class="form-control"
                            min="0"
                            value="{{ joueur.assists }}"
                            required>

                    </div>

                </div>

                <hr>

                <div class="d-flex gap-2 flex-wrap">

                    <button type="submit"
                            class="btn btn-success">

                        💾 Sauvegarder

                    </button>

                    <a href="/admin/passeurs"
                       class="btn btn-secondary">

                        Retour

                    </a>

                    <a href="/admin/passeurs/delete/{{ joueur.id }}"
                       class="btn btn-danger"
                       onclick="return confirm('Voulez-vous vraiment supprimer ce passeur ?');">

                        Supprimer

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
