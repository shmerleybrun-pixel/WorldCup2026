<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Admin Actualités - World Cup 2026</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

{% include 'navbar.html' %}

<main class="container my-5">

    <h1 class="fw-bold mb-4">Administration des actualités</h1>

    <form method="POST" class="card p-4 shadow-sm mb-5">

        <div class="mb-3">
            <label class="form-label">Titre</label>
            <input type="text" name="title" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contenu</label>
            <textarea name="content" class="form-control" rows="4" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Lien optionnel</label>
            <input type="text" name="link" class="form-control" placeholder="/anecdotes ou /equipes">
        </div>
        
        <div class="mb-3">
             <label class="form-label">Image</label>
             <input type="text"
                    name="image"
                    class="form-control"
                    placeholder="haiti.jpg ou worldcup.jpg">
        </div>

        <button class="btn btn-success">Ajouter l’actualité</button>

    </form>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Titre</th>
                <th>Contenu</th>
                <th>Lien</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for article in news %}
            <tr>
                <td>{{ loop.index }}</td>
                <td><strong>{{ article.title }}</strong></td>
                <td>{{ article.content }}</td>
                <td>{{ article.link }}</td>
                <td>
                    <a href="/admin/news/edit/{{ article.id }}" class="btn btn-warning btn-sm">Modifier</a>
                    <a href="/admin/news/delete/{{ article.id }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Supprimer cette actualité ?');">
                        Supprimer
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" class="text-center text-muted">Aucune actualité ajoutée.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</main>

{% include 'footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
