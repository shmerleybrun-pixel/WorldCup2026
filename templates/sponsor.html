{% include 'navbar.html' %}

<form method="POST" action="/sponsor-contact">

<div class="card shadow-lg border-0">

    <div class="card-header bg-warning text-dark text-center">
        <h3 class="mb-0">🤝 Devenir Sponsor Officiel FoziFoot World Cup 2026</h3>
    </div>

    <div class="card-body">

        <div class="mb-3">
            <label class="form-label">Nom de l'entreprise *</label>
            <input type="text" name="company" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Nom du contact *</label>
            <input type="text" name="contact_name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Adresse email *</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Téléphone</label>
            <input type="text" name="phone" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Pays</label>
            <input type="text" name="country" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Site Web</label>
            <input type="url" name="website" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Type de partenariat souhaité</label>
            <select name="partnership_type" class="form-select">
                <option>Sponsor principal</option>
                <option>Partenaire officiel</option>
                <option>Sponsor publicitaire</option>
                <option>Partenaire média</option>
                <option>Autre</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Budget approximatif</label>
            <select name="budget" class="form-select">
                <option>Moins de 500 USD</option>
                <option>500 - 1 000 USD</option>
                <option>1 000 - 5 000 USD</option>
                <option>5 000 - 10 000 USD</option>
                <option>10 000 USD et plus</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Message *</label>
            <textarea name="message"
                      rows="6"
                      class="form-control"
                      required></textarea>
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold">
            Envoyer ma demande de sponsoring
        </button>

    </div>

</div>

</form>
