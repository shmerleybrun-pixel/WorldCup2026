<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Choisir le type de pronostic</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .choice-card {
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #ffffff, #f4f7ff);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            transition: 0.3s ease;
        }

        .choice-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 22px 50px rgba(0,0,0,0.22);
        }

        .choice-icon {
            width: 80px;
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="world-bg"></div>

{% include 'navbar.html' %}

<main class="container my-5">

    <h1 class="text-center fw-bold mb-5">
        Choisir le type de pronostic
    </h1>

    <div class="row justify-content-center">

        <div class="col-lg-5 mb-4">
            <div class="card choice-card h-100 text-center p-4">

                <div class="card-body">

                    <img src="{{ url_for('static', filename='images/cup.png') }}"
                         class="choice-icon"
                         alt="Pronostic public">

                    <h2>Pronostic public</h2>

                    <p class="text-muted">
                        Tes points comptent dans le classement général des pronostiqueurs.
                    </p>

                    <a href="/predictions?type=public" class="btn btn-primary btn-lg">
                        Jouer en public
                    </a>

                </div>

            </div>
        </div>

        <div class="col-lg-5 mb-4">
            <div class="card choice-card h-100 text-center p-4">

                <div class="card-body">

                    <img src="{{ url_for('static', filename='images/group.png') }}"
                         class="choice-icon"
                         alt="Pronostic privé">

                    <h2>Pronostic privé</h2>

                    <p class="text-muted">
                        Crée un groupe privé et joue seulement avec tes amis.
                    </p>

                    <a href="/groupes-prives" class="btn btn-success btn-lg">
                        Jouer en privé
                    </a>

                </div>

            </div>
        </div>

    </div>

</main>

{% include 'footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
